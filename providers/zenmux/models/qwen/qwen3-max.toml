# Toggle: reasoning.enabled = true|false
# Budget: reasoning.max_tokens (integer reasoning tokens)
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "alibaba/qwen3-max-thinking"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 1.2
output = 6
cache_read = 0.12
cache_write = 1.5

[[cost.tiers]]
tier = { type = "context", size = 32_000 }
input = 2.4
output = 12
cache_read = 0.24
cache_write = 3

[[cost.tiers]]
tier = { type = "context", size = 128_000 }
input = 3
output = 15
cache_read = 0.3
cache_write = 3.75
