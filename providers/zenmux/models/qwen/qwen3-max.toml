# Toggle: reasoning.enabled = true|false
# Budget: reasoning.max_tokens (integer reasoning tokens)
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "alibaba/qwen3-max"
name = "Qwen3-Max-Thinking"
description = "Qwen3-Max-Thinking is an updated release built on the Qwen3 series, offering major improvements in reasoning, instruction following, multilingual support, and long-tail knowledge coverage compared to the January 2025 version. It delivers higher accuracy in math, coding, logic, and science tasks, follows complex instructions in Chinese and English more reliably, reduces hallucinations, and produces higher-quality responses for open-ended Q&A, writing, and conversation. The model supports over 100 languages with stronger translation and commonsense reasoning, and is optimized for retrieval-augmented generation (RAG) and tool calling, though it does not include a dedicated “thinking” mode."
release_date = "2026-01-23"
last_updated = "2026-01-23"
reasoning = true
structured_output = true

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 1.2
output = 6
cache_read = 0.12
cache_write = 1.5

[[cost.tiers]]
tier = { type = "context", size = 32_000 }
input = 2.4
output = 12
cache_read = 0.24
cache_write = 3

[[cost.tiers]]
tier = { type = "context", size = 128_000 }
input = 3
output = 15
cache_read = 0.3
cache_write = 3.75

[limit]
context = 256_000
output = 32_000
