# Effort: reasoning_effort = low|medium|high
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "alibaba/qwen3.5-flash"
name = "Qwen3.5-Flash"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.1
output = 0.4
cache_read = 0.01
cache_write = 0.125

[limit]
context = 1_024_000
output = 1_024_000
