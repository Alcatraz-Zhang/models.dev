# Effort: reasoning_effort = low|medium|high
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "alibaba/qwen3.5-plus"
name = "Qwen3.5-Plus"
attachment = true
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.4
output = 2.4
cache_read = 0.04
cache_write = 0.5

[[cost.tiers]]
tier = { type = "context", size = 256_000 }
input = 0.5
output = 3
cache_read = 0.05
cache_write = 0.625

[limit]
output = 64_000
