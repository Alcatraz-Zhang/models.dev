# ZenMux's 2026-09-19 page has supports_reasoning=1 and its live OpenAI list has
# capabilities.reasoning=true for this id. The transcription route advertises no
# reasoning parameters or side channel, so it has no caller control.
# ZenMux pricing is non-token-denominated for this route and is intentionally omitted.
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "alibaba/qwen3-asr-flash"
name = "Qwen3 ASR Flash"
attachment = true
reasoning = true
reasoning_options = []

[limit]
context = 1_000_000
output = 65_536
