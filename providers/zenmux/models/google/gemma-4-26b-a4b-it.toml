# ZenMux's 2026-09-19 protocol model lists report reasoning/thinking disabled
# for this route, so this is an intentional host override.
# https://zenmux.ai/docs/api/openai/openai-list-models.html
base_model = "google/gemma-4-26b-a4b-it"
reasoning = false

[cost]
input = 0.15
output = 0.6
cache_read = 0.015

[limit]
output = 65_535

[modalities]
input = ["image", "video", "text"]
